services:
  terroir-demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bses-terroir-app
    image: bses-terroir-demo:latest
    restart: unless-stopped
    ports:
      - "3103:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
