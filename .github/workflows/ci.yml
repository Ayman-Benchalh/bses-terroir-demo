name: TERROIR Quality Gate & CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Typecheck & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npx tsc --noEmit

  build-and-test:
    name: Build & Playwright Test Suite
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Standalone
        run: npm run build

      - name: Copy Standalone Static Assets
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Unit Tests (Pricing & Localization)
        run: npx playwright test tests/unit/

      - name: Run Mobile Navigation Quality Gate
        run: npx playwright test tests/e2e/mobile-navigation.spec.ts

      - name: Run Storefront User Journeys
        run: npx playwright test tests/e2e/storefront-flow.spec.ts

      - name: Run Moroccan Checkout & Tracking Flow
        run: npx playwright test tests/e2e/checkout-and-tracking.spec.ts

      - name: Run Admin Operations Sandbox
        run: npx playwright test tests/e2e/admin-demo.spec.ts

  docker-verification:
    name: Docker Containerization Build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: bses-terroir-demo:latest
